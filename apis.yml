- aid: axway:axway-amplify-engage
  name: Axway Amplify Engage
  description: >-
    Axway Amplify Engage is a centralized API marketplace solution that curates, packages, and monetizes
    APIs. It provides automated API discovery and threat detection, multi-gateway support via agent-based
    integration, API curation with categorization and versioning, and comprehensive observability dashboards
    tracking API adoption and usage.
  humanURL: https://www.axway.com/en/products/amplify-engage
