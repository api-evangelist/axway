  name: Axway Amplify AI Gateway
  description: >-
    Axway Amplify AI Gateway is a secure, enterprise-grade AI gateway that governs AI integration, orchestrates
    intelligence, and accelerates innovation by integrating LLMs, vector databases, and chatbots into
