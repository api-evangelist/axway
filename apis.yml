- aid: axway:axway-api-manager
  name: Axway API Manager
  description: >-
    Axway API Manager is a web-based management interface layered on top of API Gateway that enables organizations
    to register, virtualize, secure, and publish APIs to internal and external consumers. It provides
    lifecycle management, consumer self-service, and usage analytics for the full API catalog.
