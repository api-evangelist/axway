- aid: axway:axway-amplify-streams
  name: Axway Amplify Streams
  description: >-
    Axway Amplify Streams provides a real-time event streaming API platform enabling publishers to push
    data updates to subscribers over Server-Sent Events (SSE) or WebSocket connections. It decouples producers
    from consumers for low-latency, event-driven API patterns across enterprise applications.
  humanURL: https://docs.axway.com/bundle/amplify-streams/
  baseURL: https://streams-open-docs.netlify.app
