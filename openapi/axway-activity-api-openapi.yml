              pattern: ^[0-9]+\.?([0-9]+)?(px|%|em|rem)$
            right:
              type: string
              pattern: ^[0-9]+\.?([0-9]+)?(px|%|em|rem)$
            top:
              type: string
              pattern: ^[0-9]+\.?([0-9]+)?(px|%|em|rem)$
        genderedLangSchema:
          type: object
          properties:
            en-US:
