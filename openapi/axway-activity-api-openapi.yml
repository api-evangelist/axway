        added_roles:
          type: array
          description: Set of roles newly assigned to the user.
          items:
            type: string
            enum:
            - administrator
            - developer
            - auditor
            - consumer
            - usage_reporter
            - api_central_admin
          example:
          - administrator
        changes:
          $ref: '#/components/schemas/EventDataChanges'
        previous_role:
          type: string
          description: Identifier of the users previous default role in the organization. Only set if the default role is changed.
          enum:
          - administrator
          - developer
          - auditor
          - consumer
          example: administrator
        removed_roles:
          type: array
          description: Set of roles no longer assigned to the user.
          items:
            type: string
            enum:
            - administrator
            - developer
            - auditor
            - consumer
            - usage_reporter
            - api_central_admin
          example:
          - administrator
        role:
          type: string
          description: Identifier of the users default role in the organization. Only set if the default role is changed.
          enum:
          - administrator
          - developer
          - auditor
          - consumer
          example: administrator
