      security:
      - BearerClient: []
      - SessionCookie: []
      - BearerUser: []
      parameters:
      - $ref: '#/components/parameters/fields'
        example: example_value
      - $ref: '#/components/parameters/exclude_fields'
        example: example_value
      - in: query
        name: app_guid
        required: false
        schema:
          type: string
          description: guid of the app to query.
        example: example_value
      - in: query
        name: contexts
        required: false
        schema:
          type: array
          description: Type of events to return.
          items:
            type: string
            enum:
            - api_central
            - app
            - auth
            - catalog
            - org
            - team
            - user
        example:
        - api_central
      - in: query
        name: data
        required: false
        schema:
          type: boolean
          description: Return event and data properties for events
        example: true
      - in: query
        name: enrich
        required: false
        schema:
          type: boolean
          description: Whether to replace identifiers with user names in event messages. Requires "limit" parameter to be passed.
        example: true
      - in: query
        name: exclude_contexts
        required: false
        schema:
          type: array
          description: Type of events to exclude.
          items:
            type: string
            enum:
            - api_central
            - app
            - auth
            - catalog
            - org
            - team
            - user
        example:
        - api_central
      - in: query
        name: from
        required: false
        schema:
          type: number
          description: Starting timestamp to get data for.
        example: 1.0
      - in: query
        name: org_id
        required: false
        schema:
          type: string
          description: '`guid` or `org_id` of the org to query.'
        example: 507f1f77bcf86cd799439011
      - in: query
        name: redact
        required: false
        schema:
          type: boolean
          description: Whether to apply redaction of email addresses per the org's setting.
        example: true
      - in: query
        name: sort
        required: false
        schema:
          type: number
          description: 'Sort direction: `1` - ascending, `-1` - descending.'
          enum:
          - -1
          - 1
          default: -1
        example: -1
      - in: query
        name: term
        required: false
        schema:
          type: string
          description: Prefix or exact search term
        example: example_value
      - in: query
        name: to
        required: false
        schema:
          type: number
          description: Ending timestamp to get data for.
        example: 1.0
      - in: query
        name: user_guid
        required: false
        schema:
          type: string
          description: guid of the user to query.
        example: example_value
      - in: query
        name: user_messages
        required: false
        schema:
          type: boolean
          description: Use user-specific message for events for the signed-in user.
        example: true
      - in: query
        name: limit
        required: false
        schema:
          type: number
          minimum: 0
          maximum: 100
          description: Number of results per page. Zero will return an empty result, but the matched count in meta will be returned.
          default: 25
        example: 1.0
      - in: query
        name: page
        required: false
        schema:
          type: number
          description: Page of results.
          default: 1
        example: 1.0
      - in: query
        name: skip
        required: false
        schema:
          type: number
          description: Number of items to skip in results, used for pagination.
          default: 0
        example: 1.0
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    Provider:
      type: object
      required:
      - consumer
      - consumer_approve
      - guid
      - name
      - org_guid
      - public
      - signup
      - terms
      x-defs:
        menu_item:
          type: object
          required:
          - type
          - text
          - url
          unevaluatedProperties: false
          discriminator:
            propertyName: type
            mapping:
              url: '#/components/schemas/Provider/x-defs/menu_item/oneOf/0'
              document: '#/components/schemas/Provider/x-defs/menu_item/oneOf/1'
          oneOf:
          - type: object
            properties:
              type:
                type: string
                enum:
                - url
              url:
                type: string
                description: URL or relative path for the link.
                pattern: (^((https?:\/\/[A-Za-z0-9.-]+|(?:www\.|[-;:&=+$,\w]+@)[A-Za-z0-9.-]+)((?:\/[+~%/.\w\-_]*)?\??(?:[-+=&;%@.\w_]*)#?(?:[\w?/:@\-._~!$&'()*+,;=]*))?)$|^(?:\/[+~%/.\w\-_]*)(?:\?[-+=&;%@.\w_]*)?(?:#[.!/\\\w]*)?$)
          - type: object
            properties:
              type:
                type: string
                enum:
                - document
              url:
                type: string
                description: Document resource guid
          properties:
            new_tab:
              type: boolean
              description: Whether the link opens in a new tab.
            text:
              type: string
              description: Label for the link.
              x-no-tags: true
            type:
              type: string
              description: Type of the link.
              enum:
              - document
              - url
            url:
              type: string
              description: URL, relative path, or document resource guid for the link.
            visibility:
              type: integer
              description: 'Which users the link is visible to. Always shown: 0, Signed in: 1, Signed out: 2, Hidden: 3'
              enum:
              - 0
              - 1
              - 2
              - 3
        onboarding.items.hint:
          type: string
          description: Contextual information for the element.
        onboarding.items.text:
          type: string
          description: Label for the element.
        onboarding_props:
          type: object
          required:
          - id
          - type
          - text
          properties:
            hint:
              type: object
              description: Contextual information for the element.
              default: {}
              properties:
                en-US:
                  type: string
                  description: English language value.
                  allOf:
                  - $ref: '#/components/schemas/Provider/x-defs/onboarding.items.hint'
                fr-FR:
                  type: string
                  description: French language value.
                  allOf:
                  - $ref: '#/components/schemas/Provider/x-defs/onboarding.items.hint'
                de-DE:
                  type: string
                  description: German language value.
                  allOf:
                  - $ref: '#/components/schemas/Provider/x-defs/onboarding.items.hint'
                pt-BR:
                  type: string
                  description: Portuguese language value.
                  allOf:
                  - $ref: '#/components/schemas/Provider/x-defs/onboarding.items.hint'
            id:
              type: string
              description: Identifier for the element.
              pattern: '[\w-]{21}'
            required:
              type: boolean
              description: Whether entry is required for the element.
            text:
              type: object
              description: Label for the element.
              default: {}
              properties:
                en-US:
                  type: string
                  description: English language value.
                  allOf:
                  - $ref: '#/components/schemas/Provider/x-defs/onboarding.items.text'
                fr-FR:
                  type: string
                  description: French language value.
                  allOf:
                  - $ref: '#/components/schemas/Provider/x-defs/onboarding.items.text'
                de-DE:
                  type: string
                  description: German language value.
                  allOf:
                  - $ref: '#/components/schemas/Provider/x-defs/onboarding.items.text'
                pt-BR:
                  type: string
                  description: Portuguese language value.
                  allOf:
                  - $ref: '#/components/schemas/Provider/x-defs/onboarding.items.text'
            type:
              type: string
              description: Type of element.
              enum:
              - header
              - text
              - number
              - date
              - checkbox
              - toggle
              - select
              - multiselect
            visibility:
              type: number
              description: Whether the field is only available to provider administrators
              enum:
              - 0
              - 1
        onboarding.items.placeholder:
          type: string
          description: Placeholder or example value for the element.
        placeholder:
          type: object
          description: Placeholder or example value for the element.
          default: {}
          properties:
            en-US:
              type: string
              description: English language value.
              allOf:
              - $ref: '#/components/schemas/Provider/x-defs/onboarding.items.placeholder'
            fr-FR:
              type: string
              description: French language value.
              allOf:
